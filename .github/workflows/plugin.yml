# Harmonique Mini (native VST3 + AU): tests, builds and validates on every push.
#   · Linux: TypeScript tests, C++ engine == TypeScript engine (golden), the stuck-key test, pluginval
#   · macOS: universal AU + VST3, the stuck-key test, auval, pluginval → Harmonique-Mini-macOS.zip
#            Signed + notarized when the Apple secrets are set (see plugin/README.md), else ad-hoc signed.
#   · Windows: VST3
# Download the plugins from the run's "Artifacts".
name: Plugin

on:
  push:
    paths: ['plugin/**', 'engine/**', 'scripts/golden-engine.ts', 'tests/**', 'package*.json', '.github/workflows/plugin.yml']
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run still in progress.
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, golden engine check, Linux VST3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Golden data from the TypeScript engine
        run: npx tsx scripts/golden-engine.ts golden.json
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libfreetype-dev libfontconfig1-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libglu1-mesa-dev xvfb
      - run: cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DHARMONIQUE_TESTS=ON -DHARMONIQUE_COPY_AFTER_BUILD=OFF
      - run: cmake --build build --parallel 4 --target harmonique_engine_test harmonique_plugin_test HarmoniqueMini_VST3
      - name: C++ engine plays exactly what the TypeScript engine plays
        run: ./build/harmonique_engine_test_artefacts/Release/harmonique_engine_test golden.json
      - name: Stuck-key test
        run: xvfb-run -a ./build/harmonique_plugin_test_artefacts/Release/harmonique_plugin_test screenshots
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: screenshots }
      - name: pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process "build/HarmoniqueMini_artefacts/Release/VST3/Harmonique Mini.vst3"

  macos:
    name: macOS AU + VST3
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal, Apple silicon + Intel)
        run: |
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DHARMONIQUE_TESTS=ON -DHARMONIQUE_COPY_AFTER_BUILD=ON
          cmake --build build --parallel 3 --config Release --target HarmoniqueMini_All HarmoniqueMiniMidiFX_All harmonique_plugin_test
      - name: Stuck-key test
        run: ./build/harmonique_plugin_test_artefacts/Release/harmonique_plugin_test screenshots
      - name: Sign with Developer ID (when the Apple secrets are set)
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          for p in ~/Library/Audio/Plug-Ins/Components/"Harmonique Mini"*.component ~/Library/Audio/Plug-Ins/VST3/"Harmonique Mini.vst3"; do
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$p"
          done
      - name: Ad-hoc sign (no Apple secrets)
        if: env.MACOS_CERT_P12 == ''
        run: |
          for p in ~/Library/Audio/Plug-Ins/Components/"Harmonique Mini"*.component ~/Library/Audio/Plug-Ins/VST3/"Harmonique Mini.vst3"; do
            codesign --force --deep --sign - "$p"
          done
      - name: auval (Apple's Audio Unit validator)
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -strict -v aumu Hmni Oscl
          auval -strict -v aumi Hmnf Oscl
      - name: pluginval (VST3 + AU)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process ~/Library/Audio/Plug-Ins/VST3/"Harmonique Mini.vst3"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process ~/Library/Audio/Plug-Ins/Components/"Harmonique Mini.component"
      - name: Package
        run: |
          mkdir -p out
          cp -R ~/Library/Audio/Plug-Ins/Components/"Harmonique Mini.component" ~/Library/Audio/Plug-Ins/Components/"Harmonique Mini MIDI FX.component" \
                ~/Library/Audio/Plug-Ins/VST3/"Harmonique Mini.vst3" plugin/INSTALL-mac.txt out/
          # Installer: puts the plugins in /Library/Audio/Plug-Ins/{VST3,Components}. Installed files don't carry the
          # download quarantine, so no "Not Opened" warnings for the plugins themselves.
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components
          ditto out/"Harmonique Mini.vst3" pkgroot/Library/Audio/Plug-Ins/VST3/"Harmonique Mini.vst3"
          ditto out/"Harmonique Mini.component" pkgroot/Library/Audio/Plug-Ins/Components/"Harmonique Mini.component"
          ditto out/"Harmonique Mini MIDI FX.component" pkgroot/Library/Audio/Plug-Ins/Components/"Harmonique Mini MIDI FX.component"
          pkgbuild --analyze --root pkgroot components.plist
          cat components.plist
          n=$(/usr/libexec/PlistBuddy -c "Print" components.plist | grep -c "BundleIsRelocatable" || true)
          for ((i = 0; i < n; i++)); do /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" components.plist; done
          pkgbuild --root pkgroot --component-plist components.plist --identifier com.oscillateaudioworks.harmoniquemini \
                   --version 0.2.0 --install-location / "Harmonique Mini Installer.pkg"
          cp "Harmonique Mini Installer.pkg" out/
          rm -f Harmonique-Mini-macOS.zip
          ditto -c -k --sequesterRsrc out Harmonique-Mini-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonique-Mini-Installer
          path: Harmonique Mini Installer.pkg
      - name: Notarize (when the Apple secrets are set)
        if: env.MACOS_CERT_P12 != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit Harmonique-Mini-macOS.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          for p in out/*.component out/*.vst3; do xcrun stapler staple "$p"; done
          rm Harmonique-Mini-macOS.zip
          ditto -c -k --sequesterRsrc out Harmonique-Mini-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonique-Mini-macOS
          path: Harmonique-Mini-macOS.zip

  windows:
    name: Windows VST3
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S plugin -B build -DHARMONIQUE_COPY_AFTER_BUILD=OFF
      - run: cmake --build build --parallel 4 --config Release --target HarmoniqueMini_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonique-Mini-Windows-VST3
          path: build/HarmoniqueMini_artefacts/Release/VST3/Harmonique Mini.vst3
